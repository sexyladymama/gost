name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Test GhostKit (Swift Package)
        run: swift test --package-path Packages/GhostKit

      - name: Build GhostShell.app
        run: |
          xcodebuild build \
            -project GhostShell.xcodeproj \
            -scheme GhostShell \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build

      - name: Launch smoke test (app must start and stay running)
        run: |
          APP=build/Build/Products/Debug/GhostShell.app/Contents/MacOS/GhostShell
          "$APP" &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "GhostShell is running (pid $PID)"
            kill "$PID"
          else
            wait "$PID"; echo "GhostShell exited early with status $?"; exit 1
          fi

      - name: Test via the Xcode scheme
        run: |
          xcodebuild test \
            -project GhostShell.xcodeproj \
            -scheme GhostShell \
            -destination 'platform=macOS' \
            -derivedDataPath build
